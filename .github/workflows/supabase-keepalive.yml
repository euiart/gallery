# Supabase 무료 프로젝트가 1주일 동안 쉬어서 일시 정지되지 않도록,
# 3일마다 전시 목록을 한 번 읽어 와요. (읽기만 하고 아무것도 바꾸지 않아요)
name: Supabase keepalive

on:
  schedule:
    - cron: "17 3 */3 * *"   # 3일마다 한국시간 낮 12시 17분쯤
  workflow_dispatch:          # Actions 화면에서 직접 실행해 볼 수도 있어요

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read exhibitions once
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://lxytcwnkrccgqnyemjib.supabase.co/rest/v1/exhibitions?select=id&limit=1" \
            -H "apikey: sb_publishable_fMUwo-pr0a8YV3K_GVD4VQ_PDk_NIT-")
          echo "Supabase answered: $code"
          test "$code" = "200"
