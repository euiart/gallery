<body>
<canvas id="c" tabindex="0" aria-label="3D 가상 전시장"></canvas>

<div class="hud" id="hud">
  <div class="brand" id="brand"><div class="t" id="bTitle"></div><div class="a" id="bArtist"></div></div>
  <div class="tools">
    <div class="bgm-ticker" id="bTicker" hidden><span id="bTitleTxt">🎵 배경음악</span></div>
    <button class="btn dark" id="bTour">순서대로 보기</button>
    <button class="btn" id="bList">작품 목록</button>
    <button class="btn" id="bNote">작가노트</button>
    <button class="btn" id="bEx">전시 목록</button>
    <button class="btn" id="bLight">조명</button>
    <button class="btn" id="bAudio" hidden>음악 끄기</button>
    <button class="btn" id="bEdit" hidden>편집</button>
    <div class="langsw" role="group" aria-label="Language"><button data-l="ko">KO</button><button data-l="en">EN</button><button data-l="ja">JA</button></div>
  </div>
</div>
<div class="hint" id="hint"></div>
<div id="hudCopy" aria-hidden="true"></div>
<div class="panel" id="lightPanel" hidden>
  <div class="lp-row"><label id="lpThL">전시실 분위기</label></div>
  <div class="lp-themes" id="lpThemes"></div>
  <div class="lp-row"><label id="lpFlL">바닥</label></div>
  <div class="lp-themes lp-floors" id="lpFloors"></div>
  <div class="lp-mini"><span id="lpFbL">밝기</span><input type="range" id="lpFb" min="-50" max="50" step="1"><span id="lpFtL">톤</span><input type="range" id="lpFt" min="-50" max="50" step="1"></div>
  <div class="lp-row"><label id="lpWlL">벽</label></div>
  <div class="lp-themes lp-floors" id="lpWalls"></div>
  <div class="lp-row"><label id="lpClL">천장</label></div>
  <div class="lp-themes lp-floors" id="lpCeils"></div>
  <div class="lp-thnote" id="lpThNote"></div>
  <div class="lp-row"><label for="lpRoom">공간 밝기</label><span id="lpRoomV"></span></div>
  <input type="range" id="lpRoom" min="0" max="100" step="1">
  <div class="lp-row"><label for="lpArt">작품 조명</label><span id="lpArtV"></span></div>
  <input type="range" id="lpArt" min="0" max="100" step="1">
  <label class="lp-check"><input type="checkbox" id="lpLink"> 작품 밝기도 작품 조명에 맞춰 조절</label>
  <div class="lp-foot"><button class="btn" id="lpReset">기본값</button><span id="lpNote"></span></div>
</div>

<div id="intro">
  <div class="langsw intro-lang" role="group" aria-label="Language"><button data-l="ko">한국어</button><button data-l="en">English</button><button data-l="ja">日本語</button></div>
  <div class="intro-card">
    <div class="eyebrow" id="iEyebrow">Online Exhibition</div>
    <div class="itype" id="iType"></div>
    <h1 id="iTitle">&nbsp;</h1>
    <div class="sub" id="iSub"></div>
    <div class="rule"></div>
    <div class="artist" id="iArtist"></div>
    <div class="meta" id="iMeta"></div>
    <button class="btn dark enter" id="iEnter" disabled>입장하기</button>
    <div class="loading" id="iLoad">전시장을 준비하는 중…</div>
    <div class="copy" id="iCopy"></div>
  </div>
</div>

<div class="panel" id="info" role="dialog" aria-live="polite">
  <div class="idx"><span id="nIdx"></span><button class="x" id="nClose" aria-label="닫기">×</button></div>
  <h2 id="nTitle"></h2>
  <div class="en" id="nEn"></div>
  <div class="specs" id="nSpecs"></div>
  <div class="note" id="nNote"></div>
  <div class="nav"><button class="btn" id="nPrev">← 이전</button><button class="btn dark" id="nZoom">확대 보기</button><button class="btn" id="nNext">다음 →</button></div>
</div>

<aside class="panel drawer" id="dList"><div class="dhead"><h3>작품 목록</h3><button class="x" data-close>×</button></div><div class="grid" id="listGrid"></div></aside>
<aside class="panel drawer" id="dNote"><div class="dhead"><h3>작가노트</h3><button class="x" data-close>×</button></div><div class="prose" id="noteBody"></div></aside>
<aside class="panel drawer" id="dEx"><div class="dhead"><h3>전시 목록</h3><button class="x" data-close>×</button></div><div class="exlist" id="exBody"></div></aside>
<aside class="panel drawer" id="dEdit"><div class="dhead"><h3>전시 편집</h3><button class="x" data-close>×</button></div><div id="editBody"></div></aside>

<div id="viewer" hidden>
  <div id="vStage"><img id="vImg" alt="" draggable="false"><div id="vShield"></div></div>
  <div id="vMark"></div>
  <div id="vTop">
    <button class="vbtn back" id="vClose"><span aria-hidden="true">←</span> 전시장으로</button>
    <div id="vCap"><b id="vTitle"></b><span id="vMeta"></span></div>
    <span id="vCount"></span>
  </div>
  <div id="vBar">
    <button class="vbtn" id="vPrev" aria-label="이전 작품">‹</button>
    <span class="vsep"></span>
    <button class="vbtn" id="vOut" aria-label="축소">−</button>
    <span id="vPct">100%</span>
    <button class="vbtn" id="vIn" aria-label="확대">+</button>
    <button class="vbtn txt" id="vFit">맞추기</button>
    <span class="vsep"></span>
    <button class="vbtn" id="vNext" aria-label="다음 작품">›</button>
  </div>
  <div id="vHint">두 손가락으로 벌려 확대 · 두 번 탭하면 확대/원래대로</div>
</div>
<div id="measTag" hidden></div>
<div id="toast"></div>
<div id="err"></div>
<input type="file" id="filePick" accept="image/*" hidden>
<input type="file" id="audioPick" accept="audio/*,.mp3,.m4a,.ogg,.wav" hidden>
<div id="login" hidden><div class="lg-card" role="dialog" aria-modal="true"></div></div>
