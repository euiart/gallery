ーにversion.jsonがありません。アップロード用zipのversion.jsonも一緒に上げてください。"],"이 버전과 다른 파일이 있어요:":["These files do not match this version:","このバージョンと違うファイルがあります:"],"업로드 zip의 파일을 빠짐없이 같은 폴더에 올렸는지 확인해 주세요.":["Check that every file in the upload zip went up, into the same folders.","アップロード用zipのファイルを漏れなく同じフォルダに上げたか確認してください。"],"방금 올렸다면 1~2분 뒤에 다시 확인해 보세요.":["If you just uploaded, check again in a minute or two.","アップロードした直後なら、1〜2分後にもう一度確認してください。"],"다시 확인":["Check again","再確認"],"자동 백업 확인하는 중…":["Checking the automatic backup…","自動バックアップを確認中…"],"자동 백업에서 이 전시 불러오기":["Load this exhibition from the automatic backup","自動バックアップからこの展示を読み込む"],"지난 자동 백업 보기":["Older automatic backups","過去の自動バックアップを見る"],"매주 월요일 새벽, 모든 전시의 설정이 GitHub에 자동으로 저장돼요(최근 26주). 큰 작업을 하기 전에는 아래에서 직접 한 번 더 내려받아 두면 더 안전해요.":["Every Monday before dawn (Korea time), the settings of every exhibition are saved to GitHub automatically (last 26 weeks). Before big changes, downloading a copy yourself below is safer still.","毎週月曜の早朝(韓国時間)、すべての展示の設定がGitHubに自動で保存されます(直近26週)。大きな作業の前には、下で自分でも一度保存しておくとより安心です。"],"아직 자동 백업이 없어요. 매주 월요일 새벽에 만들어져요.":["There is no automatic backup yet. It is made every Monday before dawn.","自動バックアップはまだありません。毎週月曜の早朝に作られます。"],"2주 넘게 자동 백업이 되지 않았어요. GitHub 저장소의 Actions에서 ‘Weekly gallery backup’이 켜져 있는지 확인해 주세요.":["No automatic backup for more than two weeks. Check that ‘Weekly gallery backup’ is enabled under Actions in the GitHub repository.","2週間以上自動バックアップが行われていません。GitHubリポジトリのActionsで「Weekly gallery backup」が有効か確認してください。"],"이 전시는 아직 자동 백업에 없어요.":["This exhibition is not in the automatic backup yet.","この展示はまだ自動バックアップに入っていません。"],"한 번 더 누르면 불러와요":["Press again to load","もう一度押すと読み込みます"],"자동 백업을 불러오지 못했어요.":["Could not load the automatic backup.","自動バックアップを読み込めませんでした。"],"✂ 사진 손질":["✂ Edit photo","✂ 写真の手直し"],"사진을 돌리거나 수평을 맞추고, 자르거나 밝기를 조절해요":["Rotate, level, crop or brighten the photo","写真を回転・水平合わせ・切り抜き・明るさ調整します"],"작품 사진 손질":["Edit artwork photo","作品写真の手直し"],"사진 손질 창을 열지 못했어요. 잠시 뒤 다시 눌러 주세요.":["Couldn't open the photo editor. Please try again in a moment.","写真の手直し画面を開けませんでした。少し待ってからもう一度押してください。"],"먼저 사진을 넣어 주세요.":["Add a photo first.","先に写真を入れてください。"],"왼쪽으로 90도":["Rotate 90° left","左に90度"],"오른쪽으로 90도":["Rotate 90° right","右に90度"],"0.1° 왼쪽":["0.1° left","0.1° 左"],"0.1° 오른쪽":["0.1° right","0.1° 右"],"수평 0°로":["Level to 0°","水平を0°に"],"사진 — 틀을 끌거나 화살표 키로 옮겨요":["Photo — drag the frame or move it with the arrow keys","写真 — 枠をドラッグするか矢印キーで動かします"],"누르고 있는 동안 손질 전 사진":["Shows the photo before editing while held down","押している間、手直し前の写真を表示"],"자르지 않음":["No crop","切り抜かない"],"자유":["Free","自由"],"원본 보기":["Original","元の写真"],"처음으로":["Start over","最初に戻す"],"취소":["Cancel","キャンセル"],"이대로 쓰기":["Use this","これで使う"],"원본 (손질 전)":["Original (before editing)","元の写真（手直し前）"],"(빈 모서리는 잘라냄)":["(empty corners cropped)","（空いた角は切り取り）"],"90° 회전":["rotated","回転"],"결과:":["Result:","結果:"],"수평":["Level","水平"],"밝기":["Brightness","明るさ"],"자름":["cropped","切り抜き"],"사진이 없어요. 사진을 다시 골라 주세요.":["There is no photo. Please choose it again.","写真がありません。もう一度選んでください。"],"사진을 열지 못했어요. (JPG·PNG·WEBP — 다른 사이트 사진이면 컴퓨터에 받아서 다시 골라 주세요)":["Couldn't open the photo. (JPG, PNG or WEBP — if it is from another site, save it to your computer and choose it again)","写真を開けませんでした。（JPG・PNG・WEBP — 他のサイトの写真なら、パソコンに保存してから選び直してください）"],"사진을 만들지 못했어요.":["Couldn't make the photo.","写真を作れませんでした。"],"이 벽 작품 고르게 정렬":["Space works on this wall evenly","この壁の作品を均等に並べる"],"다른 벽을 고르면 그 벽 오른쪽 끝에 걸고 두 벽을 고르게 다시 정렬해요. 전시장 화면에서 작품을 다른 벽으로 끌어 놓을 수도 있어요.":["Choosing another wall hangs the work at its right end and re-spaces both walls evenly. You can also drag a work onto another wall in the gallery view.","別の壁を選ぶと、その壁の右端に掛けて両方の壁を均等に並べ直します。展示室の画面で作品を別の壁へドラッグすることもできます。"],"격자가 있는 벽이라 빈자리에 걸었어요.":["This wall has a grid, so the work was hung in a free spot.","グリッドのある壁なので、空いている場所に掛けました。"],"벽이 좁아 작품이 겹칠 수 있어요. 일부를 다른 벽으로 옮기거나 전시장 크기를 늘려 주세요.":["The wall is too narrow and works may overlap. Move some to another wall or make the room larger.","壁が狭く、作品が重なる場合があります。一部を別の壁に移すか、展示室を広げてください。"],"격자가 있는 벽은 고르게 정렬할 수 없어요. 격자 칸에서 맞춰 주세요.":["A wall with a grid can't be spaced evenly. Adjust it in the grid settings.","グリッドのある壁は均等に並べられません。グリッドの設定で調整してください。"],"이 벽 작품을 고르게 정렬했어요.":["Works on this wall are now evenly spaced.","この壁の作品を均等に並べました。"],"백업과 복원":["Backup & restore","バックアップと復元"],"무료 서버는 자동 백업이 없어요. 큰 작업을 하기 전과 전시를 연 뒤에 한 번씩 내려받아 두세요.":["The free server keeps no automatic backups. Download one before big changes and after an exhibition opens.","無料サーバーには自動バックアップがありません。大きな作業の前と、展示を公開した後に一度ずつ保存しておきましょう。"],"이 전시 설정 내려받기":["Download this exhibition's settings","この展示の設定を保存"],"설정 파일 불러오기":["Load a settings file","設定ファイルを読み込む"],"불러온 내용은 저장하기를 눌러야 관람객에게 반영돼요. 마음에 들지 않으면 ↶ 로 되돌릴 수 있어요.":["Loaded settings reach visitors only after you press Save. If it is not right, undo with ↶.","読み込んだ内容は「保存」を押すと来場者に反映されます。気に入らなければ ↶ で戻せます。"],"모든 전시 한 번에 내려받기":["Download all exhibitions","すべての展示をまとめて保存"],"서버 저장공간 확인":["Check server storage","サーバー容量を確認"],"모든 전시의 설정과 방명록, 방문 기록이 파일 하나로 내려받아져요. 이미지 파일은 들어가지 않아요(목록만 담겨요).":["Settings, guestbooks and visit counts of every exhibition, in one file. Image files are not included (only their list).","すべての展示の設定・芳名録・来場記録を一つのファイルに保存します。画像ファイルは含まれません(一覧のみ)。"],"모으는 중…":["Collecting…","収集中…"],"계산하는 중…":["Calculating…","計算中…"],"올린 파일":["Uploaded files","アップロードしたファイル"],"파일 수":["Number of files","ファイル数"],"관람객이 이미지를 받아 가는 전송량(무료 월 5 GB)은 Supabase 사용량 페이지에서만 볼 수 있어요. GitHub에 올린 이미지는 여기에 들어가지 않아요.":["Data sent to visitors (free: 5 GB a month) is shown only on the Supabase usage page. Images kept on GitHub do not count here.","来場者への転送量(無料で月5GB)はSupabaseの使用量ページでのみ確認できます。GitHubに置いた画像はここに含まれません。"],"Supabase 사용량 페이지 열기":["Open the Supabase usage page","Supabaseの使用量ページを開く"],"사용량을 불러오지 못했어요.":["Could not load the usage.","使用量を読み込めませんでした。"],"설정 파일을 읽지 못했어요.":["Could not read the settings file.","設定ファイルを読み込めませんでした。"],"이 백업 파일에는 지금 전시의 설정이 없어요.":["This backup has no settings for this exhibition.","このバックアップにはこの展示の設定がありません。"],"전시 설정 파일이 아니에요.":["This is not an exhibition settings file.","展示の設定ファイルではありません。"],"설정 파일을 불러왔어요. 확인한 뒤 저장해 주세요.":["Settings file loaded. Check it, then save.","設定ファイルを読み込みました。確認してから保存してください。"],"내려받지 못했어요.":["Could not download.","保存できませんでした。"],"백업하지 못했어요:":["Could not back up:","バックアップできませんでした:"],"사이트에 올려 둔 도록 쓰기":["Use the catalogue kept with the site","サイトに置いた図録を使う"],"지금 사이트에 올려 둔 도록을 쓰고 있어요.":["The catalogue kept with the site is in use.","サイトに置いた図録を使っています。"],"사이트 파일과 함께 올린 도록이 있어요. 이것을 쓰면 온라인 저장공간을 쓰지 않아요.":["There is a catalogue uploaded with the site files. Using it takes no online storage.","サイトのファイルと一緒に置いた図録があります。これを使うとオンライン保存領域を使いません。"],"도록":["Catalogue","図録"],"관람객에게 보이기":["Show to visitors","来場者に表示"],"자동 도록 (전시 정보로 만들기)":["Automatic catalogue (made from the exhibition)","自動図録(展示の情報から作る)"],"도록 이미지 (직접 만든 도록 올리기)":["Catalogue pages (upload your own catalogue)","図録の画像(作った図録をアップロード)"],"보이지 않음":["Hidden","表示しない"],"관람객이 PDF로 저장할 수 있게 하기":["Let visitors save it as PDF","来場者がPDFで保存できるようにする"],"도록 미리 보기":["Preview the catalogue","図録をプレビュー"],"도록 링크 복사":["Copy catalogue link","図録のリンクをコピー"],"자동 도록":["Automatic catalogue","自動図録"],"표지 · 제목 · 작가노트 · 작품마다 한 쪽 · 작가 소개 · 판권 순서로 자동으로 만들어져요. 작품 정보를 고치면 도록도 함께 바뀌어요.":["It is made automatically: cover, title page, artist note, one page per work, artist, colophon. When you edit a work, the catalogue changes too.","表紙・タイトル・作家ノート・作品ごとに1ページ・作家紹介・奥付の順に自動で作られます。作品情報を直すと図録も一緒に変わります。"],"표지 작품":["Cover work","表紙の作品"],"서문":["Foreword","序文"],"(비워 두면 작가노트를 써요)":["(empty: the artist note is used)","(空欄なら作家ノートを使います)"],"판권 면":["Colophon","奥付"],"(기획·사진·디자인 등, 한 줄에 하나)":["(curation, photography, design… one per line)","(企画・写真・デザインなど、1行に1つ)"],"도록 이미지":["Catalogue pages","図録の画像"],"페이지 이미지(JPG·PNG)를 여러 장 한꺼번에 고르면 파일 이름 순서대로 들어가요. 인쇄용 PDF가 있으면 그대로 골라도 돼요. 쪽마다 웹용으로 줄여서 올려요.":["Select several page images (JPG/PNG) at once; they go in file-name order. You can also pick a print PDF as it is. Each page is made smaller for the web before uploading.","ページ画像(JPG・PNG)を複数まとめて選ぶと、ファイル名の順に入ります。印刷用PDFがあればそのまま選んでもかまいません。ページごとにWeb用に小さくしてアップロードします。"],"이미지 올리기":["Upload images","画像をアップロード"],"PDF에서 가져오기":["Import from PDF","PDFから読み込む"],"모두 지우기":["Remove all","すべて削除"],"한 번 더 누르면 모두 지워요":["Press again to remove all","もう一度押すとすべて削除します"],"첫 쪽(표지)은 한 장, 나머지는 두 쪽씩 펼쳐 보기 (이미지가 이미 펼침면이면 끄세요)":["Show the first page (cover) alone and the rest as two-page spreads (turn off if your images are already spreads)","最初のページ(表紙)は1枚、残りは見開きで表示(画像がすでに見開きならオフに)"],"앞으로":["Move earlier","前へ"],"뒤로":["Move later","後ろへ"],"원본 PDF":["Original PDF","元のPDF"],"(선택: 관람객이 원본을 내려받게 하려면)":["(optional: lets visitors download the original)","(任意:来場者が元のファイルをダウンロードできるように)"],"올린 원본 보기":["View the uploaded original","アップロードした元ファイルを見る"],"원본 빼기":["Remove original","元ファイルを外す"],"원본 PDF 올리기":["Upload original PDF","元のPDFをアップロード"],"도록 링크를 복사했어요.":["Catalogue link copied.","図録のリンクをコピーしました。"],"로그인해야 도록 이미지를 올릴 수 있어요.":["Log in to upload catalogue pages.","図録の画像をアップロードするにはログインしてください。"],"PDF를 여는 중…":["Opening the PDF…","PDFを開いています…"],"PDF를 열지 못했어요. 다른 파일로 해 보세요.":["Could not open the PDF. Try another file.","PDFを開けませんでした。別のファイルでお試しください。"],"원본 PDF는 25MB까지 올릴 수 있어요.":["The original PDF can be up to 25 MB.","元のPDFは25MBまでです。"],"원본 PDF를 올리는 중…":["Uploading the original PDF…","元のPDFをアップロードしています…"],"원본 PDF를 올렸어요. 저장하기를 눌러야 반영돼요.":["Original PDF uploaded. Press Save to apply.","元のPDFをアップロードしました。保存すると反映されます。"],"그레이 마블":["Grey marble","グレーマーブル"],"밝은 나무 천장":["Light wood","明るい木の天井"],"삼나무 천장":["Cedar","杉板の天井"],"합판 천장":["Plywood","合板の天井"],"월넛 천장":["Walnut","ウォルナットの天井"],"테마를 고르면 벽·바닥·천장이 한 세트로 함께 바뀌어요. 그다음 아래에서 하나씩 따로 바꿀 수 있어요.":["Choosing a theme changes the walls, floor and ceiling together as a set. You can then change each one below.","テーマを選ぶと、壁・床・天井がセットでまとめて変わります。そのあと下で一つずつ変えられます。"],"바닥에 반사 보이기 (광택 있는 바닥)":["Show reflections on the floor (glossy floors)","床に映り込みを表示(光沢のある床)"],"화이트 큐브 기본 바닥":["White cube default floor","ホワイトキューブの標準の床"],"(바닥이 ‘테마 기본’일 때)":["(when the floor is ‘Theme default’)","(床が「テーマ標準」のとき)"],"벽 색 (화이트 큐브 기본 벽일 때)":[ 다리는 글":["Waiting for review","確認待ちの書き込み"],"공개하기":["Publish","公開する"],"지우기":["Delete","削除"],"새로 온 글이 없어요.":["No new messages.","新しい書き込みはありません。"],"공개된 글":["Published","公開中の書き込み"],"공개된 글이 없어요.":["No published messages.","公開中の書き込みはありません。"],"새로고침":["Refresh","更新"],"한 번 더 누르면 지워요":["Press again to delete","もう一度押すと削除します"],"지웠어요.":["Deleted.","削除しました。"],"공개했어요. 관람객에게 바로 보여요.":["Published. Visitors can see it now.","公開しました。来場者にすぐ表示されます。"],"숨겼어요.":["Hidden.","非表示にしました。"],"바꾸지 못했어요. 잠시 후 다시 해 주세요.":["Could not change it. Please try again shortly.","変更できませんでした。しばらくしてからお試しください。"],"확인을 기다리는 방명록 글이 있어요. 방명록 탭에서 볼 수 있어요.":["There are guestbook messages waiting for review. See the Guestbook tab.","確認待ちの芳名録の書き込みがあります。芳名録タブで見られます。"],"방문 기록":["Visits","来場記録"],"불러오는 중…":["Loading…","読み込み中…"],"전시에 입장한 횟수예요. 편집하려고 로그인한 방문은 세지 않아요.":["The number of times the exhibition was entered. Visits by someone logged in to edit are not counted.","展示に入場した回数です。編集のためにログインした人は数えません。"],"오늘":["Today","今日"],"최근 7일":["Last 7 days","直近7日"],"최근 30일":["Last 30 days","直近30日"],"전체":["Total","合計"],"방문 기록을 쓰려면 Supabase에서 SQL을 한 번 실행해야 해요. 도움말의 방문 기록 항목을 봐 주세요.":["To use visit counts, run the SQL once in Supabase. See “Visits” in Help.","来場記録を使うには、SupabaseでSQLを一度実行してください。ヘルプの「来場記録」をご覧ください。"],"여러 작품을 골라 한꺼번에 옮기기":["Tick several works to move them together","複数の作品を選んでまとめて動かす"],"옮길 작품을 목록에서 골라 주세요.":["Tick the works to move in the list.","動かす作品を一覧で選んでください。"],"같은 벽에 있는 작품을 3점 이상 골라야 간격을 맞출 수 있어요.":["Tick at least three works on the same wall to space them evenly.","同じ壁の作品を3点以上選ぶと間隔をそろえられます。"],"격자에 들어 있는 작품은 그대로 두었어요.":["Works in a grid were left as they are.","グリッドに入っている作品はそのままにしました。"],"고른 작품을 한꺼번에 옮겨요.":["Move the ticked works together.","選んだ作品をまとめて動かします。"],"눈높이로 맞추기":["Align to eye level","目の高さにそろえる"],"첫 작품 높이로 맞추기":["Align to the first work","最初の作品の高さにそろえる"],"간격 똑같이":["Space evenly","間隔を均等に"],"선택 해제":["Clear selection","選択を解除"],"전시 목록에서 숨기기 (주소를 아는 사람만 볼 수 있어요)":["Hide from the exhibition list (only people with the address can see it)","展示一覧に表示しない(アドレスを知っている人だけが見られます)"],"이 전시를 복제해 새 전시 만들기":["Copy this exhibition to make a new one","この展示を複製して新しい展示を作る"],"지금 전시의 공간·조명·음악 설정을 그대로 가진 새 전시가 만들어져요. 지금 전시는 바뀌지 않아요.":["A new exhibition is made with the same room, lighting and music settings. This exhibition does not change.","今の展示の空間・照明・音楽の設定をそのまま持つ新しい展示が作られます。今の展示は変わりません。"],"새 전시 주소":["New address","新しい展示のアドレス"],"영문 소문자·숫자·- (예: spring-2027)":["lowercase letters, numbers, - (e.g. spring-2027)","英小文字・数字・-(例: spring-2027)"],"새 전시 제목":["New title","新しい展示のタイトル"],"비워 두면 지금 제목 그대로":["Leave empty to keep the current title","空欄なら今のタイトルのまま"],"작품은 빼고 공간 설정만 복사":["Copy the room settings only, without the works","作品を除いて空間の設定だけ複製"],"편집할 사람":["Editor","編集する人"],"아이디 (선택, 예: test5)":["ID (optional, e.g. test5)","ID(任意、例: test5)"],"편집할 사람의 로그인 계정은 Supabase의 Authentication에서 따로 만들어야 해요.":["The editor's login account must be created separately under Authentication in Supabase.","編集する人のログインアカウントは、SupabaseのAuthenticationで別に作る必要があります。"],"새 전시 만들기":["Create the new exhibition","新しい展示を作る"],"주소는 영문 소문자·숫자·-만 써서 3~40자로 적어 주세요. (-ko, -en, -ja로 끝나면 안 돼요)":["Use 3–40 lowercase letters, numbers and - for the address. (It must not end in -ko, -en or -ja.)","アドレスは英小文字・数字・-だけで3〜40文字にしてください。(-ko、-en、-jaで終わるものは使えません)"],"이미 있는 주소예요. 다른 주소를 적어 주세요.":["That address is already taken. Please choose another.","そのアドレスはすでに使われています。別のアドレスにしてください。"],"새 전시를 만들었지만 편집할 사람은 등록하지 못했어요. 새 전시 주소를 복사해 두었어요.":["The new exhibition was created, but the editor could not be registered. Its address has been copied.","新しい展示を作りましたが、編集する人は登録できませんでした。新しい展示のアドレスをコピーしました。"],"새 전시를 만들고 주소를 복사했어요. 전시 목록에는 숨김으로 들어가 있어요.":["The new exhibition was created and its address copied. It is hidden from the exhibition list for now.","新しい展示を作り、アドレスをコピーしました。展示一覧では非表示になっています。"],"다른 곳에서 저장된 내용이 있어요. 저장하면 이 화면의 내용으로 덮어써요.":["Someone saved this exhibition elsewhere. Saving will overwrite it with what is on this screen.","ほかの場所で保存された内容があります。保存するとこの画面の内容で上書きされます。"],"다른 곳에서 저장된 내용이 있어요. 저장하기를 한 번 더 누르면 이 화면의 내용으로 덮어써요.":["Someone saved this exhibition elsewhere. Press Save once more to overwrite it with what is on this screen.","ほかの場所で保存された内容があります。保存するをもう一度押すと、この画面の内容で上書きされます。"],"저장하지 않고 닫은 작업이 이 기기에 남아 있어요.":["Work that was closed without saving is still on this device.","保存せずに閉じた作業がこの端末に残っています。"],"이어서 작업":["Continue that work","続きから作業"],"버리기":["Discard","破棄"],"남아 있던 작업을 불러왔어요. 확인한 뒤 저장해 주세요.":["The remaining work has been restored. Check it, then save.","残っていた作業を読み込みました。確認してから保存してください。"],"사진 여러 장 올리기":["Upload several photos","写真をまとめてアップロード"],"한 번에 20장까지 올릴 수 있어요. 앞의 20장만 올려요.":["Up to 20 photos at a time. Only the first 20 will be uploaded.","一度に20枚までアップロードできます。最初の20枚だけアップロードします。"],"사진을 읽지 못했어요.":["Could not read the photos.","写真を読み込めませんでした。"],"올리지 못한 사진이 있어요. 그 작품을 열어 [다시 올리기]를 눌러 주세요.":["Some photos could not be uploaded. Open those works and press [Upload again].","アップロードできなかった写真があります。その作品を開いて[もう一度アップロード]を押してください。"],"사진을 작품으로 추가했어요. 제목과 크기를 확인한 뒤 저장해 주세요.":["The photos were added as works. Check the titles and sizes, then save.","写真を作品として追加しました。タイトルとサイズを確認してから保存してください。"],"도움말":["Help","ヘルプ"],"도움말을 불러오지 못했어요. 탭을 다시 눌러 주세요.":["Could not load the help. Please press the tab again.","ヘルプを読み込めませんでした。タブをもう一度押してください。"],"도움말을 불러오는 중…":["Loading help…","ヘルプを読み込み中…"],"PNG로 저장":["Save as PNG","PNGで保存"],"링크 복사":["Copy link","リンクをコピー"],"인쇄할 때는 한 변을 2cm보다 크게, 둘레의 흰 여백을 자르지 말고 쓰세요.":["When printing, keep each side larger than 2 cm and do not crop the white margin.","印刷するときは一辺を2cmより大きくし、まわりの白い余白を切らずに使ってください。"],"링크를 복사했어요.":["Link copied.","リンクをコピーしました。"],"복사하지 못했어요. QR 코드 창의 주소를 직접 복사해 주세요.":["Could not copy. Please copy the address shown in the QR code window.","コピーできませんでした。QRコードの画面のアドレスを直接コピーしてください。"],"QR 코드를 만들지 못했어요. 잠시 뒤 다시 눌러 주세요.":["Could not make the QR code. Please try again in a moment.","QRコードを作れませんでした。しばらくしてからもう一度押してください。"],"저장했지만, 아직 올라가지 않은 이미지가 있어요. 그 작품을 열어 [다시 올리기]를 눌러 주세요.":["Saved, but some images have not been uploaded yet. Open those works and press [Upload again].","保存しましたが、まだアップロードされていない画像があります。その作品を開いて[もう一度アップロード]を押してください。"],"⚠ 새 이미지가 아직 올라가지 않았어요. 지금 저장하면 관람객에게는 이전 이미지가 보여요.":["⚠ The new image has not been uploaded yet. If you save now, visitors will still see the previous image.","⚠ 新しい画像がまだアップロードされていません。今保存すると、観覧者には前の画像が表示されます。"],"다시 올리기":["Upload again","もう一度アップロード"],"이 작품 링크 복사":["Copy link to this work","この作品のリンクをコピー"],"이 작품 QR 코드":["QR code for this work","この作品のQRコード"],"링크나 QR로 들어온 관람객은 이 작품 앞에서 관람을 시작해요. 저장한 뒤에 쓸 수 있어요.":["Visitors who arrive by this link or QR code start in front of this work. Available after saving.","このリンクやQRコードから入った観覧者は、この作品の前から鑑賞を始めます。保存した後に使えます。"],"전시 링크 복사":["Copy exhibition link","展示のリンクをコピー"],"전시 QR 코드":["Exhibition QR code","展示のQRコード"],"관람객 화면으로 보기":["View as a visitor","観覧者の画面で見る"],"관람객에게 보이는 화면이에요. 위의 [편집]을 누르면 돌아와요.":["This is what visitors see. Press [Edit] at the top to come back.","観覧者に見える画面です。上の[編集]を押すと戻ります。"],"여러 작품 한꺼번에 고치기":["Edit several works at once","複数の作品をまとめて修正"],"비워 두면 바꾸지 않아요":["Leave empty to keep as is","空欄なら変更しません"],"적용 대상":["Apply to","適用対象"],"모든 작품":["All works","すべての作品"],"그 칸이 비어 있는 작품만":["Only works where that field is empty","その欄が空の作品のみ"],"적용":["Apply","適用"],"적용할까요?":["Apply?","適用しますか?"],"바꿀 내용을 입력해 주세요.":["Enter what to change.","変更する内容を入力してください。"],"한꺼번에 고쳤어요. Ctrl+Z로 되돌릴 수 있어요.":["Updated. You can undo with Ctrl+Z.","まとめて修正しました。Ctrl+Zで元に戻せます。"],"그림자 종류":["Shadow figures","影の種類"],"사람 (기본 그림)":["People (drawn)","人物(標準)"],"사람 실루엣":["People silhouettes","人物シルエット"],"사람 실루엣 + 고양이":["People silhouettes + cats","人物シルエット+猫"],"고양이":["Cats","猫"],"공룡":["Dinosaurs","恐竜"],"세트 전체 해제":["Release all sets","セットをすべて解除"],"모든 세트를 풀까요?":["Release every set?","すべてのセットを解除しますか?"],"모든 세트를 풀었어요. 작품은 지금 걸린 자리에 그대로 있어요.":["All sets released. The works stay where they hang.","すべてのセットを解除しました。作品は今の位置のままです。"],"목록 오른쪽의 고리 버튼을 누르면 바로 위 작품과 세트로 묶거나 풀 수 있어요.":["Use the link button on the right of the list to join a work to the one above it, or release it.","一覧の右にあるリンクボタンで、すぐ上の作品とセットにしたり解除したりできます。"],"위 작품과 묶은 세트 풀기":["Release from the work above","上の作品とのセットを解除"],"위 작품과 세트로 묶기":["Join with the work above as a set","上の作品とセットにする"],"이 세트 풀기":["Release this set","このセットを解除"],"격자에 들어 있는 작품은 세트로 묶을 수 없어요. 먼저 격자에서 빼 주세요.":["Works in a grid cannot be joined as a set. Take them out of the grid first.","グリッドに入っている作品はセットにできません。先にグリッドから外してください。"],"저장하기 (Ctrl+S)":["Save (Ctrl+S)","保存する (Ctrl+S)"],"편집 속도":["Editing speed","編集の速さ"],"(이 기기에만 적용)":["(this device only)","(この端末のみ)"],"편집하는 동안 바닥 반사 끄기 (관람객 화면은 그대로예요)":["Hide the floor reflection while editing (visitors still see it)","編集中は床の映り込みを消す(観覧者の画面はそのまま)"],"되돌리기 (Ctrl+Z)":["Undo (Ctrl+Z)","元に戻す (Ctrl+Z)"],"다시 실행 (Ctrl+Shift+Z)":["Redo (Ctrl+Shift+Z)","やり直す (Ctrl+Shift+Z)"],"더 되돌릴 작업이 없어요.":["Nothing more to undo.","これ以上戻せる操作はありません。"],"다시 실행할 작업이 없어요.":["Nothing to redo.","やり直す操作はありません。"],"한 단계 되돌렸어요.":["Undone.","一つ戻しました。"],"다시 실행했어요.":["Redone.","やり直しました。"],"캡션":["Caption","キャプション"],"작품마다 따로":["One per work","作品ごと"],"격자 전체에 하나":["One for the whole grid","グリッド全体に一つ"],"숨기기":["Hidden","隠す"],"연작 제목":["Series title","連作タイトル"],"예: 얽힘 01–10":["e.g. Entanglement 01–10","例: 絡み合い 01–10"],"격자의 조명은 세로 줄마다 하나씩 고르게 비춰요. 격자에 넣은 작품을 직접 옮기면 격자에서 빠져요.":["The grid is lit evenly, one light per column. Moving a work in the grid by hand takes it out of the grid.","グリッドの照明は列ごとに一つずつ均一に照らします。グリッドの作品を直接動かすとグリッドから外れます。"],"이 작품은 격자에서 빠져 직접 배치로 바뀌었어요.":["This work left the grid and is now placed by hand.","この作品はグリッドから外れ、手動配置になりました。"],"벽 가운데로":["Centre on wall","壁の中央へ"],"벽에 격자로 배치하기":["Arrange a wall as a grid","壁にグリッドで配置"],"여러 줄 · 가운데 맞춤":["rows · centred","複数段 · 中央ぞろえ"],"아래 작품을 누른 다음 넣을 칸을 누르세요. 끌어다 놓아도 돼요. 칸에 넣은 작품은 벽 가운데에 맞춰 바로 걸려요.":["Tap a work below, then tap the cell to put it in. Drag and drop also works. Works in cells are hung right away, centred on the wall.","下の作品を押してから、入れるマスを押してください。ドラッグ&ドロップもできます。マスに入れた作品は壁の中央に合わせてすぐ掛けられます。"],"가로 칸":["Columns","列"],"세로 줄":["Rows","段"],"작품 간격 cm":["Gap cm","作品の間
